[package]
name = "mamo-connector"
version = "0.1.0"
edition = "2024"
authors = ["Mamo Connector Team"]
description = "Mamo Connector desktop launcher handling custom URI scheme"
license = "MIT"

[dependencies]
anyhow = "1"
url = "2"
cfg-if = "1"
directories = "5"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.28", default-features = true, features = ["glow", "default_fonts"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "windef"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"

