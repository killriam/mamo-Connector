name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout mamo-Connector
        uses: actions/checkout@v4
        with:
          path: mamo-Connector

      - name: Checkout mamo-sim
        uses: actions/checkout@v4
        with:
          repository: killriam/mamo-sim
          path: mamo-sim

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mamo-Connector/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mamo-Connector/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        working-directory: mamo-Connector
        run: cargo build --release

      - name: Rename artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $src = "mamo-Connector\target\release\mamo-connector.exe"
          $dst = "mamo-connector-$version-windows-x64.exe"
          Copy-Item $src $dst
          Write-Host "Artifact: $dst ($([math]::Round((Get-Item $dst).Length/1MB,1)) MB)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $asset  = "mamo-connector-$version-windows-x64.exe"
          $notes  = @"
          ## MaMo Connector $version

          Desktop companion app for MaMo — handles ``mamoConnector://`` deeplinks to:
          - Launch Forge MTG with your deck loaded and ready to play
          - Run AI gameplay simulations natively
          - Sync replays and game logs back to MaMo

          ### Installation (Windows)
          1. Download ``$asset``
          2. Run it — Windows may show a SmartScreen warning; click **More info → Run anyway**
          3. On first launch, configure your Forge installation path in the **Settings** tab
          4. The app registers the ``mamoConnector://`` URL scheme automatically

          > macOS and Linux builds are not yet available.
          "@
          gh release create $version `
            --repo "${{ github.repository }}" `
            --title "MaMo Connector $version" `
            --notes $notes `
            $asset
